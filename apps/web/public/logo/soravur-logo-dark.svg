<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo Background/Icon -->
  <rect x="5" y="10" width="40" height="40" rx="8" fill="url(#gradientDark)"/>
  
  <!-- Letter S -->
  <path d="M25 20 C30 20, 32 22, 32 25 C32 28, 30 29, 25 30 C20 31, 18 32, 18 35 C18 38, 20 40, 25 40" 
        stroke="white" 
        stroke-width="3" 
        stroke-linecap="round" 
        fill="none"/>
  
  <!-- Text: Soravur -->
  <text x="55" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#f9fafb">
    Soravur
  </text>
  
  <!-- Subtitle -->
  <text x="55" y="48" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">
    Imtihon yordamchisi
  </text>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>


