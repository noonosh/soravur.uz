name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref so PR pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      # Convex codegen runs as part of `convex dev`, which we can't run
      # in CI without a deployment. We keep prebuilt _generated/ stubs
      # in tree (committed), and the Bun lockfile pin keeps installs
      # deterministic.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun run test

      # Smoke build catches Next-compiler-only failures (typedRoutes,
      # MDX, client-only imports) that pass tsc but break next build.
      - name: Build (smoke)
        run: bun run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
